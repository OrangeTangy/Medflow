server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 26m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 310s;
  }
  location = /health/live { proxy_pass http://api:8000; }
  location / { try_files $uri $uri.html $uri/ =404; }
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
}
